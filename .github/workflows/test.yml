name: Tests

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos:
        - darwin
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Running Tests
        run: go test ./...
